<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    "Acompanhar pedido" (/r/#<token>, DN-17, WN-6). HTML e JS estáticos, sem framework e sem script
    inline (CSP `script-src 'self'`). Fonte do sistema, sem arquivo de fonte (R2-3). A API vem da meta.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="motoka-api" content="__MOTOKA_API__">
  <title>Acompanhar pedido · Motoka</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/_static/r/r.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Motoka</span>
    </header>

    <section id="loading" class="card" aria-busy="true">
      <div class="skeleton wide"></div>
      <div class="skeleton"></div>
    </section>

    <section id="order" class="card" hidden>
      <p class="eyebrow" id="store"></p>
      <h1 id="title"></h1>
      <p class="muted" id="subtitle"></p>
      <ol class="steps" id="steps" aria-label="Etapas do pedido"></ol>
      <p class="muted" id="position" role="status" aria-live="polite"></p>
    </section>

    <section id="code-card" class="card" hidden>
      <p class="label">Código de entrega</p>
      <p class="code" id="code"></p>
      <p class="muted">Diga este código ao motoboy quando ele chegar.</p>
    </section>

    <section id="error" class="card error" hidden>
      <h1 id="error-title"></h1>
      <p class="muted" id="error-text" role="alert"></p>
    </section>

    <p class="muted foot" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="/_static/r/r.js"></script>
</body>
</html>
