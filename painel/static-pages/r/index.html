<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    "Acompanhar pedido" (/r/#<token>, DN-17). O WN-0 só reserva a rota, o _redirects
    (/r/* -> /r/) e os headers (Referrer-Policy: no-referrer, noindex). A página de verdade, com
    o polling do P1, é do WN-6. Fonte do sistema, sem arquivo de fonte (R2-3).
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0A0A0A">
  <title>Acompanhar pedido · Motoka</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/_static/r/r.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Motoka</span>
    </header>
    <section class="card">
      <h1>Acompanhar pedido</h1>
      <p class="muted">O acompanhamento ainda não está disponível. Fale com a loja para saber do seu pedido.</p>
    </section>
  </main>
</body>
</html>
